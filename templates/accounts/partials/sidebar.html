<div class="account-sidebar">
  <div class="account-user-info text-center mb-3 p-3">
    {% if user.profile.avatar %}
    <img src="{{ user.profile.avatar.url }}" alt="{{ user.get_full_name }}" class="user-avatar mb-2">
    {% else %}
    <div class="user-avatar-placeholder mb-2"><i class="fas fa-user-circle fa-4x text-gold"></i></div>
    {% endif %}
    <strong>{{ user.get_full_name }}</strong>
    <p class="text-muted small mb-0">{{ user.email }}</p>
  </div>
  <ul class="account-nav-list">
    <li><a href="{% url 'accounts:dashboard' %}" class="{% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}"><i class="fas fa-tachometer-alt"></i>Dashboard</a></li>
    <li><a href="{% url 'accounts:my_orders' %}" class="{% if 'order' in request.resolver_match.url_name %}active{% endif %}"><i class="fas fa-box"></i>My Orders</a></li>
    <li><a href="{% url 'accounts:wishlist' %}" class="{% if request.resolver_match.url_name == 'wishlist' %}active{% endif %}"><i class="fas fa-heart"></i>Wishlist</a></li>
    <li><a href="{% url 'accounts:addresses' %}" class="{% if 'address' in request.resolver_match.url_name %}active{% endif %}"><i class="fas fa-map-marker-alt"></i>Addresses</a></li>
    <li><a href="{% url 'accounts:my_reviews' %}" class="{% if request.resolver_match.url_name == 'my_reviews' %}active{% endif %}"><i class="fas fa-star"></i>My Reviews</a></li>
    <li><a href="{% url 'accounts:profile' %}" class="{% if request.resolver_match.url_name == 'profile' %}active{% endif %}"><i class="fas fa-user-edit"></i>Edit Profile</a></li>
    <li><a href="{% url 'accounts:change_password' %}" class="{% if request.resolver_match.url_name == 'change_password' %}active{% endif %}"><i class="fas fa-lock"></i>Change Password</a></li>
    <li class="logout-item"><a href="{% url 'account_logout' %}"><i class="fas fa-sign-out-alt"></i>Logout</a></li>
  </ul>
</div>
