{% extends 'base.html' %}
{% block title %}Email Sent – {{ site_name }}{% endblock %}
{% block newsletter %}{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="auth-card text-center">
          <div class="auth-card-header">
            <div class="auth-icon" style="color:#198754;"><i class="fas fa-check-circle"></i></div>
            <h3 class="auth-title">Verification Email Sent!</h3>
            <p class="auth-sub">Please check your inbox and click the verification link to activate your account.</p>
          </div>
          <div class="auth-card-body">
            <a href="{% url 'shop:home' %}" class="btn btn-gold w-100">Go to Homepage</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
