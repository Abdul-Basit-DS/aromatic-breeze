{% extends 'base.html' %}
{% block title %}Email Sent – {{ site_name }}{% endblock %}
{% block newsletter %}{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="auth-card text-center">
          <div class="auth-card-header">
            <div class="auth-icon" style="background:linear-gradient(135deg,#27ae60,#2ecc71);">
              <i class="fas fa-check"></i>
            </div>
            <h3 class="auth-title">Email Sent!</h3>
            <p class="auth-sub">Check your inbox for the password reset link</p>
          </div>
          <div class="auth-card-body">
            <div class="alert alert-info text-start" style="font-size:13px;">
              <i class="fas fa-info-circle me-2"></i>
              If you don't see the email, please check your <strong>spam folder</strong>.
            </div>
            <a href="{% url 'account_login' %}" class="btn btn-gold w-100">
              <i class="fas fa-sign-in-alt me-2"></i> Back to Login
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
