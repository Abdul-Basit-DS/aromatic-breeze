{% extends 'base.html' %}
{% block title %}Page Not Found – {{ site_name }}{% endblock %}
{% block newsletter %}{% endblock %}
{% block content %}
<div class="error-page">
  <div class="container text-center py-5">
    <div class="error-number">404</div>
    <div class="error-icon"><i class="fas fa-search"></i></div>
    <h2 class="error-title">Page Not Found</h2>
    <p class="error-sub">The page you're looking for doesn't exist or has been moved.</p>
    <div class="d-flex gap-3 justify-content-center mt-4 flex-wrap">
      <a href="{% url 'shop:home' %}" class="btn btn-gold px-4"><i class="fas fa-home me-2"></i>Go Home</a>
      <a href="{% url 'shop:shop' %}" class="btn btn-outline-gold px-4"><i class="fas fa-shopping-bag me-2"></i>Browse Shop</a>
    </div>
  </div>
</div>
{% endblock %}
