server {
    listen 80;
    server_name aromaticbreeze.com www.aromaticbreeze.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name aromaticbreeze.com www.aromaticbreeze.com;

    ssl_certificate /etc/letsencrypt/live/aromaticbreeze.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aromaticbreeze.com/privkey.pem;

    client_max_body_size 20M;

    location /static/ {
        alias /var/www/aromatic_breeze/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location /media/ {
        alias /var/www/aromatic_breeze/media/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "no-referrer-when-downgrade";
}
